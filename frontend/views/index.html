<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Dinamico</title>
    
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <div class="login-box">
        <h2>Iniciar Sesion</h2>
        <form id="formLogin" action="">
            <input type="text" id="txtUsuario" placeholder="Nombre de usuario" autocomplete="off">
            <input type="password" id="txtPassword" placeholder="Contraseña" >
            <button type="submit">Ingresar Seguramente </button>
        </form>
        <div id="divMensaje" class="error-msg"></div>
    </div>
    <script src="../js/login.js"></script>
</body>
</html>
